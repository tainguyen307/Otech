spring.application.name=otech

# PostgreSQL installed locally. Override these values with environment variables in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Otech}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# The database schema is managed by the SQL script in the repository.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The schema is created by running script.sql in pgAdmin 4 or psql.
spring.sql.init.mode=never

server.port=${SERVER_PORT:8080}

app.jwt.secret=${JWT_SECRET:OTECHSECONDHANDCOMMUNITY123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.auth.reset-token-expiration-minutes=${RESET_TOKEN_EXPIRATION_MINUTES:30}
app.auth.expose-reset-token=${EXPOSE_RESET_TOKEN:true}
