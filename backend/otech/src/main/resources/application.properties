spring.application.name=otech

# PostgreSQL installed locally. Override these values with environment variables in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Otech}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# The database schema is managed by the SQL script in the repository.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The schema is created by running script.sql in pgAdmin 4 or psql.
spring.sql.init.mode=never

server.port=${SERVER_PORT:8080}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.auth.reset-token-expiration-minutes=${RESET_TOKEN_EXPIRATION_MINUTES:30}
app.auth.expose-reset-token=${EXPOSE_RESET_TOKEN:true}
app.auth.signup-otp-expiration-minutes=${SIGNUP_OTP_EXPIRATION_MINUTES:10}
app.auth.login-max-failures=${LOGIN_MAX_FAILURES:5}
app.auth.login-lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}

# Configure SMTP in the environment before enabling email delivery.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:lucvythe@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tkqg xbfw acve hgnz}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:lucvythe@gmail.com}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
